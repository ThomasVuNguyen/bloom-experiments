[project]
name = "bloomone"
version = "0.1.0"
description = "Neoantigen vaccine pipeline — MCP tools on Modal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "modal>=0.73.0",
    "fastmcp>=2.0.0",
    "fastapi>=0.115.0",
    "pandas>=2.2.0",
    "requests>=2.32.0",
    "pydantic>=2.10.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "gradio>=5.0.0",
    "python-codon-tables>=0.1.12",
    "biopython>=1.84",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
gpu = [
    "mhcflurry>=2.2.0",
    "torch>=2.4.0",
]
chatbot = [
    "vllm>=0.9.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
